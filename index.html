<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat privado para conversas seguras e rápidas.">
    <meta name="keywords" content="chat, privado, mensagens, comunicação, segurança">
    <meta name="author" content="VGB_Codev">
    <title>Chat-Privado</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
</head>
<body>
  <header>
    <h1>Chat-Privado</h1>
    <ul>
        <li><a class="menu" href="#">Conversas</a></li>
        <li><a class="menu" href="#">Sobre</a></li>
        <li><a class="menu" href="#">Ajuda</a></li>
    </ul>

</header>

<!-- Formulário de Cadastro e Login -->
<div id="authForm">

    <h2 class="mensagen_de_boas_vindas">Bem-vindo ao Chat-Privado</h2>

    <p class="texto_login">Faça login para começar a conversar !</p>

    <div class="form-container">
        <form id="loginForm">
            <img src="css2.png" alt="avatar" title="avatar" class="avatar">
            <input type="email" id="email" placeholder="Digite seu email" required>
            <input type="password" id="password" placeholder="Digite sua senha" required>
            <button type="submit" id="loginBtn">Entrar</button>
            <button type="submit" id="showSignupBtn">Cadastrar</button> 
        </form>
        <form id="signupForm" style="display: none;">

            <input type="email" id="signupEmail" placeholder="Digite seu email" required>
            <input type="password" id="signupPassword" placeholder="Digite sua senha" required>
                      
        </form>        
        <img id="googleBtn" src="icons8-google-logo-48.png" alt=""></img>
    </div>
</div>

<!-- Scripts Firebase -->
<script type="module">
    // Importações do Firebase (modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    // Configuração do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAqAadcmcVI-hYBJjpnxdC4lxwxbZIWZks",
        authDomain: "chat-privado-60dc3.firebaseapp.com",
        projectId: "chat-privado-60dc3",
        storageBucket: "chat-privado-60dc3.firebasestorage.app",
        messagingSenderId: "513902320586",
        appId: "1:513902320586:web:ac8d9015403360ccec0d33"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Ação para login com Google
    document.getElementById("googleBtn").addEventListener("click", () => {
        signInWithPopup(auth, provider)
            .then(result => {
                window.location.href = "chat.html";
            })
            .catch(error => {
                alert("Erro no login com Google: " + error.message);
            });
    });

    // Ação para login com email e senha
    document.getElementById("loginForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, password)
            .then(userCredential => {
                window.location.href = "chat.html";
            })
            .catch(error => {
                alert("Erro no login com email e senha: " + error.message);
            });
    });

        // Ação para cadastro com email e senha
        document.getElementById("signupForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;

            createUserWithEmailAndPassword(auth, email, password)
                .then(userCredential => {
                    window.location.href = "chat.html"; // Redireciona após o cadastro
                })
                .catch(error => {
                    alert("Erro ao cadastrar: " + error.message);
                });
        });

        // Mostrar formulário de cadastro
        document.getElementById("showSignupBtn").addEventListener("click", () => {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("signupForm").style.display = "block";
      });

    // Exemplo de troca entre formulários de login e cadastro
    document.getElementById("googleBtn").addEventListener("click", () => {
        showSignupForm();
    });
</script>

</body>
</html>
