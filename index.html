<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat privado para conversas seguras e rápidas.">
    <meta name="keywords" content="chat, privado, mensagens, comunicação, segurança">
    <meta name="author" content="VGB_Codev">
    <title>Chat-Privado</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>Chat-Privado</h1>
        <ul class="menu">
            <li><a class="menu_a" href="#">Contato</a></li>
            <li><a class="menu_a" href="#">Sobre</a></li>
            <li><a class="menu_a" href="#">Ajuda</a></li>
        </ul>
    </header>

    <main>
        <div id="authForm">
            <h2 class="mensagen_de_boas_vindas">Bem-vindo ao Chat-Privado</h2>
            <p class="texto_login">Faça login ou crie sua conta para começar a conversar!</p>
            <div class="form-container">
                <!-- Formulário de Login -->
                <form id="loginForm">
                    <div class="mascote">
                        <img src="" alt="avatar" class="avatar" title="Avatar">
                        <img src="mao-esquerda.png" class="mao esquerda" alt="Mão esquerda">
                        <img src="mao-direita.png" class="mao direita" alt="Mão direita">
                    </div>
                    <input type="email" id="email" placeholder="Digite seu email" required>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                    <button type="submit" class="submit">Entrar</button>
                    <button type="button" id="showSignupBtn">Criar nova conta</button>
                </form>
                <!-- Formulário de Cadastro -->
                <form id="signupForm" style="display: none;">
                    <input type="email" id="signupEmail" placeholder="Digite seu email" required>
                    <input type="password" id="signupPassword" placeholder="Digite sua senha" required>
                    <div class="avatar-upload">
                        <!-- Botão para escolher o avatar -->
                        <button type="button" id="chooseAvatarBtn" class="choose-avatar-btn">Escolher Avatar</button>
                        <!-- Campo de upload de arquivo oculto -->
                        <input type="file" id="avatarUpload" accept="image/*" style="display: none;" required>
                        <!-- Imagem de pré-visualização -->
                        <img id="avatarPreview" src="" alt="Avatar Preview" style="display:none; width: 100px; height: 100px; border-radius: 50%; margin-top: 10px; border: 3px solid #ffffff; box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);">
                    </div>
                    <button type="submit" class="submit">Cadastrar</button>
                    <button type="button" id="backToLoginBtn">Voltar para login</button>
                </form>
                <!-- Botão Google -->
                <img id="googleBtn" src="icons8-google-logo-48.png" alt="Entrar com Google" style="cursor:pointer; margin-top: 10px;">
            </div>
        </div>
    </main>

        <script type="module">
            import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import {
        getFirestore,
        doc,
        getDoc,
        setDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        import {
        getStorage,
        ref,
        uploadBytes,
        getDownloadURL
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

                // Import the functions you need from the SDKs you need
                import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
                // TODO: Add SDKs for Firebase products that you want to use
                // https://firebase.google.com/docs/web/setup#available-libraries
            
                // Your web app's Firebase configuration
                const firebaseConfig = {
                apiKey: "AIzaSyAG9_leH8plRn_shdpgTkguS1xECZ7jOlw",
                authDomain: "chat-privado-d80ea.firebaseapp.com",
                projectId: "chat-privado-d80ea",
                storageBucket: "chat-privado-d80ea.firebasestorage.app",
                messagingSenderId: "384959703301",
                appId: "1:384959703301:web:0fe16df3d1c632aee02f6c"
                };
            
                // Initialize Firebase
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Alternar entre formulários
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");
        const showSignupBtn = document.getElementById("showSignupBtn");
        const backToLoginBtn = document.getElementById("backToLoginBtn");

        showSignupBtn.addEventListener("click", () => {
            loginForm.style.display = "none";
            signupForm.style.display = "block";
        });

        backToLoginBtn.addEventListener("click", () => {
            signupForm.style.display = "none";
            loginForm.style.display = "block";
        });

        // Pré-visualização do avatar
        const avatarUpload = document.getElementById("avatarUpload");
        const avatarPreview = document.getElementById("avatarPreview");
        const chooseAvatarBtn = document.getElementById("chooseAvatarBtn");

        chooseAvatarBtn.addEventListener("click", () => {
            avatarUpload.click();
        });

        avatarUpload.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    avatarPreview.src = event.target.result;
                    avatarPreview.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });

        // Formulário de Login
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const senha = document.getElementById("password").value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;
                console.log("Usuário autenticado:", user.uid);

                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    localStorage.setItem("currentUser", JSON.stringify(userData));
                    window.location.href = "chat.html";
                } else {
                    alert("Usuário não encontrado no banco de dados.");
                }
            } catch (error) {
                console.error("Erro no login:", error.code, error.message);
                alert("Erro no login: " + error.message + " (Código: " + error.code + ")");
            }
        });

        // Formulário de Cadastro
        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("signupEmail").value;
            const senha = document.getElementById("signupPassword").value;
            const avatarFile = avatarUpload.files[0];

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;
                console.log("Usuário cadastrado:", user.uid);

                let avatarURL = "";
                if (avatarFile) {
                    const storageRef = ref(storage, `avatars/${user.uid}/${avatarFile.name}`);
                    await uploadBytes(storageRef, avatarFile);
                    avatarURL = await getDownloadURL(storageRef);
                }

                const userData = {
                    email: user.email,
                    uid: user.uid,
                    avatar: avatarURL,
                    createdAt: new Date()
                };

                await setDoc(doc(db, "usuarios", user.uid), userData);
                localStorage.setItem("currentUser", JSON.stringify(userData));
                window.location.href = "chat.html";
            } catch (error) {
                console.error("Erro no cadastro:", error.code, error.message);
                alert("Erro no cadastro: " + error.message + " (Código: " + error.code + ")");
            }
        });

        // Login com Google
        const googleBtn = document.getElementById("googleBtn");
        googleBtn.addEventListener("click", async () => {
            console.log("Botão Google clicado");
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                console.log("Usuário autenticado com Google:", user.uid);

                const docRef = doc(db, "usuarios", user.uid);
                const docSnap = await getDoc(docRef);

                let userData;
                if (!docSnap.exists()) {
                    userData = {
                        email: user.email,
                        uid: user.uid,
                        avatar: user.photoURL || "",
                        createdAt: new Date()
                    };
                    await setDoc(docRef, userData);
                    console.log("Novo usuário registrado no Firestore");
                } else {
                    userData = docSnap.data();
                    console.log("Usuário existente carregado:", userData);
                }

                localStorage.setItem("currentUser", JSON.stringify(userData));
                window.location.href = "chat.html";
            } catch (error) {
                console.error("Erro no login com Google:", error.code, error.message);
                alert("Erro no login com Google: " + error.message + " (Código: " + error.code + ")");
            }
        });
        </script>
</body>
</html>
